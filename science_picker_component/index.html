<!doctype html>
<html><head><meta charset="utf-8"><style>
[hidden] {display:none !important}
* {box-sizing:border-box}
html, body, #grid, #grid * {-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile img {-webkit-user-drag:none} body {margin:0;background:#000;color:#ddd;font:13px sans-serif}
#grid {height:480px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start;padding:4px;touch-action:none;overscroll-behavior:contain}
.tile {position:relative;padding:4px;border:3px solid #333;background:#000;color:inherit;cursor:pointer;user-select:none;min-width:0;touch-action:none}
.tile[aria-pressed=true] {border-color:#8ba3c4;box-shadow:inset 0 0 0 1px #8ba3c4}
.tile:focus-visible {outline:1px dotted #aaa;outline-offset:1px}
.tile img {width:100%;aspect-ratio:1.5;object-fit:contain;display:block;pointer-events:none}
.name {display:block;overflow-wrap:anywhere;line-height:16px;margin-top:5px;font-size:11px}
.error {display:flex;align-items:center;aspect-ratio:1.5;overflow-wrap:anywhere;font-size:11px}
footer {display:flex;align-items:center;gap:10px;padding:14px 4px} #count {margin-right:auto}
footer button {background:#000;color:#eee;border:1px solid #888;padding:8px 16px;cursor:pointer}
#apply {background:#343c49} @media(max-width:550px) {#grid {grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="grid" aria-label="FITS images"></div>
<footer><span id="count" aria-live="polite"></span><button id="cancel">Cancel</button><button id="apply">Apply</button></footer>
<script>
const grid=document.getElementById('grid'), count=document.getElementById('count');
let inline=false, previewOnly=false;
let suppressClick=false, lastWasDrag=false, lastSentEvent=null;
let selected=new Set(), tiles=[], initialized=false, drag=null, serverSelection=null, scrollFrame=null;
function send(type, extra={}) {parent.postMessage({isStreamlitMessage:true,type,...extra}, '*')}
function update() {
  for (const tile of tiles) tile.setAttribute('aria-pressed', String(selected.has(tile.dataset.name)));
  count.textContent=`${selected.size} / ${tiles.length} selected`;
}
function notify(action, extra={}) {
  lastSentEvent=crypto.randomUUID();
  send('streamlit:setComponentValue',{value:{action,selected:[...selected],event:lastSentEvent,...extra},dataType:'json'});
}
function publish() {if(inline && !previewOnly) notify('change')}
function toggle(name) {
  if(tiles.find(tile=>tile.dataset.name===name)?.dataset.selectable==='false') return;
  if(selected.has(name)) selected.delete(name);else selected.add(name);
  update();publish();
}
function paint(x,y) {
  const tile=document.elementFromPoint(x,y)?.closest('.tile');
  if(!tile || tile.dataset.selectable==='false' || !grid.contains(tile) || drag.visited.has(tile.dataset.name)) return;
  drag.visited.add(tile.dataset.name);
  if(drag.select) selected.add(tile.dataset.name);else selected.delete(tile.dataset.name);
}
function sweep(x,y) {
  const start=drag.last, steps=Math.max(1,Math.ceil(Math.hypot(x-start.x,y-start.y)/8));
  for(let i=0;i<=steps;i++) paint(start.x+(x-start.x)*i/steps,start.y+(y-start.y)*i/steps);
  drag.last={x,y};update();
}
function visibleGridRect() {
  const rect=grid.getBoundingClientRect();
  let top=Math.max(0,rect.top), bottom=Math.min(window.innerHeight,rect.bottom);
  try {
    const host=window.frameElement.getBoundingClientRect();
    top=Math.max(top,-host.top);bottom=Math.min(bottom,parent.innerHeight-host.top);
  } catch {}
  return {left:rect.left,right:rect.right,top,bottom};
}
function paintAtPointer() {
  if(!drag?.moved) return;
  const rect=visibleGridRect(), p=drag.pointer;
  if(p.x>=rect.left && p.x<=rect.right && rect.bottom>rect.top) {
    paint(p.x,Math.max(rect.top+2,Math.min(rect.bottom-2,p.y)));update();
  }
}
function scrollSelection(delta) {
  // Sample every crossed row, even when a wheel event scrolls a full page.
  const steps=Math.max(1,Math.ceil(Math.abs(delta)/8));
  for(let i=0;i<steps;i++) {
    const before=grid.scrollTop;
    grid.scrollTop+=delta/steps;paintAtPointer();
    if(grid.scrollTop===before) break;
  }
}
function scrollDrag() {
  if(!drag?.moved) return;
  const rect=visibleGridRect(), p=drag.pointer, edge=36;
  if(p.x>=rect.left && p.x<=rect.right) {
    const distance=p.y<rect.top+edge?p.y-rect.top-edge:
                   p.y>rect.bottom-edge?p.y-rect.bottom+edge:0;
    if(distance) scrollSelection(Math.sign(distance)*Math.min(18,2+Math.abs(distance)/3));
  }
  scrollFrame=requestAnimationFrame(scrollDrag);
}
function beginSweep() {
  if(drag.moved) return;
  drag.moved=true;paint(drag.start.x,drag.start.y);update();
  scrollFrame=requestAnimationFrame(scrollDrag);
}
grid.addEventListener('selectstart',event=>event.preventDefault());
grid.addEventListener('mousedown',event=>{if(event.button===0) event.preventDefault()});
grid.addEventListener('wheel',event=>{
  if(!drag) return;
  event.preventDefault();event.stopPropagation();beginSweep();
  const unit=event.deltaMode===1?16:event.deltaMode===2?grid.clientHeight:1;
  scrollSelection(event.deltaY*unit);
},{passive:false});
grid.addEventListener('scroll',()=>{
  if(drag) {beginSweep();paintAtPointer();drag.last={...drag.pointer}}
});
grid.addEventListener('pointerdown',event=>{
  const tile=event.target.closest('.tile');
  if(!tile || tile.dataset.selectable==='false' || event.button!==0) return;
  event.preventDefault();window.getSelection()?.removeAllRanges();
  tile.focus({preventScroll:true});suppressClick=false;lastWasDrag=false;
  const point={x:event.clientX,y:event.clientY};
  drag={name:tile.dataset.name,start:point,last:point,pointer:point,moved:false,
        before:new Set(selected),select:!selected.has(tile.dataset.name),visited:new Set()};
  tile.setPointerCapture(event.pointerId);
});
grid.addEventListener('pointermove',event=>{
  if(!drag) return;
  drag.pointer={x:event.clientX,y:event.clientY};
  if(!drag.moved && Math.hypot(event.clientX-drag.start.x,event.clientY-drag.start.y)>6) {
    beginSweep();
  }
  if(drag.moved) {event.preventDefault();sweep(event.clientX,event.clientY)}
});
function stop(event) {
  if(!drag) return;
  const state=drag;drag=null;cancelAnimationFrame(scrollFrame);
  lastWasDrag=state.moved;suppressClick=state.moved;
  if(event?.type!=='pointerup') {selected=state.before;update();return}
  if(state.moved) publish();
}
grid.addEventListener('pointerup',stop);grid.addEventListener('pointercancel',stop);
grid.addEventListener('lostpointercapture',stop);window.addEventListener('blur',stop);
grid.addEventListener('dragstart',event=>event.preventDefault());
grid.addEventListener('click',event=>{
  if(suppressClick) {suppressClick=false;return}
  const tile=event.target.closest('.tile');
  if(tile) toggle(tile.dataset.name);
});
grid.addEventListener('dblclick',event=>{
  const tile=event.target.closest('.tile');
  if(!tile || lastWasDrag || !inline) return;
  event.preventDefault();
  // The two preceding clicks cancel each other's selection toggle.
  notify('view',{name:tile.dataset.name});
});
function finish(action) {stop();send('streamlit:setComponentValue',{value:{action,selected:[...selected]},dataType:'json'})}
document.getElementById('apply').onclick=()=>finish('apply');
document.getElementById('cancel').onclick=()=>finish('cancel');
window.addEventListener('message',event=>{
  if(event.source!==parent || event.data.type!=='streamlit:render') return;
  const args=event.data.args;inline=!!args.inline;previewOnly=!!args.preview_only;
  if(!initialized) {
    if(inline) {
      document.getElementById('apply').hidden=true;document.getElementById('cancel').hidden=true;
      grid.style.height='320px';grid.style.gap='6px';grid.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
    }
    if(previewOnly) {
      document.querySelector('footer').hidden=true;
      grid.style.height=args.scrollable?'360px':'auto';
      grid.style.overflow=args.scrollable?'auto':'hidden';
      grid.style.gridTemplateColumns=`repeat(${args.columns || 2},minmax(0,1fr))`;
    }
    selected=new Set(args.selected);serverSelection=JSON.stringify(args.selected);grid.replaceChildren();
    for(const item of args.items) {
      const tile=document.createElement('div');tile.tabIndex=0;tile.setAttribute('role','button');tile.className='tile';tile.dataset.name=item.name;tile.dataset.selectable=String(item.selectable!==false);tile.title=(item.label || item.name) + ' — Click or drag across images to select; double-click to view';
      const visual=document.createElement(item.image?'img':'span');
      if(item.image) {visual.src=item.image;visual.alt=item.name;visual.draggable=false}
      else {visual.className='error';visual.textContent='Preview unavailable: '+item.error}
      const label=document.createElement('span');label.className='name';label.textContent=item.label || item.name;
      tile.append(visual,label);
      tile.addEventListener('keydown',e=>{if(e.target===tile && (e.key==='Enter'||e.key===' ')){e.preventDefault();tile.click()}});
      grid.append(tile);
    }
    tiles=[...grid.querySelectorAll('.tile')];update();initialized=true;
  }
  const incoming=JSON.stringify(args.selected);
  if(args.ack===lastSentEvent) lastSentEvent=null;
  if(inline && !drag && !lastSentEvent && incoming!==serverSelection) {
    serverSelection=incoming;selected=new Set(args.selected);update();
  }
  send('streamlit:setFrameHeight',{height:previewOnly?(args.scrollable?360:grid.scrollHeight+8):inline?370:550});
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
