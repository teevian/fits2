<!doctype html>
<html><head><meta charset="utf-8"><style>
[hidden] {display:none !important}
* {box-sizing:border-box} body {margin:0;background:#000;color:#ddd;font:13px sans-serif}
#grid {height:480px;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-content:start;padding:4px;touch-action:pan-y}
.tile {position:relative;padding:4px;border:2px solid #444;background:#111;color:inherit;cursor:pointer;user-select:none;min-width:0;touch-action:none}
.tile[aria-pressed=true] {border-color:#a9c8fa;background:#23344c}
.tile:focus-visible {outline:2px solid white;outline-offset:1px}
.tile img {width:100%;aspect-ratio:1.5;object-fit:contain;display:block;pointer-events:none}
.name {display:block;overflow-wrap:anywhere;line-height:16px;margin-top:5px;font-size:11px}
.mark {position:absolute;right:8px;top:8px;background:#111b;border:1px solid #bbb;width:20px;height:20px;line-height:18px}
.tile[aria-pressed=true] .mark {background:#b5d3ff;color:#000}
.error {display:flex;align-items:center;aspect-ratio:1.5;overflow-wrap:anywhere;font-size:11px}
footer {display:flex;align-items:center;gap:10px;padding:14px 4px} #count {margin-right:auto}
footer button {background:#222;color:#eee;border:1px solid #888;padding:8px 16px;cursor:pointer}
#apply {background:#294363} @media(max-width:550px) {#grid {grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div id="grid" aria-label="FITS images"></div>
<footer><span id="count" aria-live="polite"></span><button id="cancel">Cancel</button><button id="apply">Apply</button></footer>
<script>
const grid=document.getElementById('grid'), count=document.getElementById('count');
let inline=false, previewOnly=false;
let suppressClick=false, dropTarget=null;
let selected=new Set(), tiles=[], initialized=false, drag=null, last=null, pointer=null, frame=null;
function send(type, extra={}) {parent.postMessage({isStreamlitMessage:true,type,...extra}, '*')}
function update() {
  for (const tile of tiles) {
    const active=selected.has(tile.dataset.name);
    if(!previewOnly) tile.setAttribute('aria-pressed', String(active));
    if(tile.querySelector('.mark')) tile.querySelector('.mark').textContent=active?'✓':'';
  }
  count.textContent=`${selected.size} / ${tiles.length} selected`;
}
function paint(x,y) {
  if(previewOnly) return;
  const tile=document.elementFromPoint(x,y)?.closest('.tile');
  if (!tile || !grid.contains(tile) || drag.visited.has(tile.dataset.name)) return;
  drag.visited.add(tile.dataset.name);
  if (drag.select) selected.add(tile.dataset.name); else selected.delete(tile.dataset.name);
  update();
}
function sweep(x,y) {
  const start=last || {x,y}, steps=Math.max(1, Math.ceil(Math.hypot(x-start.x,y-start.y)/8));
  for(let i=1;i<=steps;i++) paint(start.x+(x-start.x)*i/steps,start.y+(y-start.y)*i/steps);
  last={x,y};
}
function scrollDrag() {
  if (!drag) return;
  const rect=grid.getBoundingClientRect();
  if(pointer && pointer.x>=rect.left && pointer.x<=rect.right) {
    const delta=pointer.y<rect.top+35?-10:pointer.y>rect.bottom-35?10:0;
    if(delta) {grid.scrollTop+=delta;paint(pointer.x,Math.max(rect.top+2,Math.min(rect.bottom-2,pointer.y)))}
  }
  frame=requestAnimationFrame(scrollDrag);
}
grid.addEventListener('pointerdown',event=>{
  const tile=event.target.closest('.tile');
  if(!tile || event.button!==0) return;
  event.preventDefault();tile.focus();
  suppressClick=false;
  drag={name:tile.dataset.name, before:new Set(selected), startX:event.clientX,startY:event.clientY, moved:false, select:!selected.has(tile.dataset.name),visited:new Set()};
  last=null;pointer={x:event.clientX,y:event.clientY};
  grid.setPointerCapture(event.pointerId);sweep(pointer.x,pointer.y);scrollDrag();
});
grid.addEventListener('pointermove',event=>{
  if(!drag) return;
  pointer={x:event.clientX,y:event.clientY};
  drag.moved ||= Math.hypot(pointer.x-drag.startX,pointer.y-drag.startY)>6;
  dropTarget=viewerAt(pointer.x,pointer.y);
  sweep(pointer.x,pointer.y);
});
function publish() {send('streamlit:setComponentValue',{value:{action:'change',selected:[...selected],event:crypto.randomUUID()},dataType:'json'})}
function viewerAt(x,y) {
  try {
    const frameRect=window.frameElement.getBoundingClientRect();
    const viewer=parent.document.querySelector('.st-key-image_viewer');
    if(!viewer) return null;
    const rect=viewer.getBoundingClientRect(), px=x+frameRect.left, py=y+frameRect.top;
    return px>=rect.left && px<=rect.right && py>=rect.top && py<=rect.bottom ? viewer : null;
  } catch { return null }
}
function view(name) {send('streamlit:setComponentValue',{value:{action:'view',name,event:crypto.randomUUID()},dataType:'json'})}
function stop(event) {
  if(!drag) return;
  const state=drag;
  const dropped=event?.type==='pointerup' && state.moved && viewerAt(event.clientX,event.clientY);
  const cancelled=event?.type==='pointercancel' || event?.type==='blur';
  drag=null;last=null;pointer=null;dropTarget=null;cancelAnimationFrame(frame);
  suppressClick=state.moved || !previewOnly;
  if(dropped || cancelled) {selected=state.before;update()}
  if(dropped) view(state.name);
  else if(!cancelled && inline && !previewOnly) publish();
}
grid.addEventListener('pointerup',stop);grid.addEventListener('pointercancel',stop);
grid.addEventListener('lostpointercapture',stop);window.addEventListener('blur',stop);
grid.addEventListener('click',event=>{
  const tile=event.target.closest('.tile');
  if(suppressClick) {suppressClick=false;return}
  if(tile && previewOnly) {view(tile.dataset.name);return}
  if(!tile || event.detail!==0) return;
  if(selected.has(tile.dataset.name)) selected.delete(tile.dataset.name);else selected.add(tile.dataset.name);
  update();if(inline) publish();
});
function finish(action) {stop();send('streamlit:setComponentValue',{value:{action,selected:[...selected]},dataType:'json'})}
document.getElementById('apply').onclick=()=>finish('apply');
document.getElementById('cancel').onclick=()=>finish('cancel');
window.addEventListener('message',event=>{
  if(event.source!==parent || event.data.type!=='streamlit:render') return;
  const args=event.data.args;inline=!!args.inline;previewOnly=!!args.preview_only;
  if(!initialized) {
    if(inline) {
      document.getElementById('apply').hidden=true;document.getElementById('cancel').hidden=true;
      grid.style.height='320px';grid.style.gap='6px';grid.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';
    }
    if(previewOnly) {document.querySelector('footer').hidden=true;grid.style.height='auto';grid.style.overflow='hidden'}
    selected=new Set(args.selected);grid.replaceChildren();
    for(const item of args.items) {
      const tile=document.createElement('div');tile.tabIndex=0;tile.setAttribute('role','button');tile.className='tile';tile.dataset.name=item.name;tile.title=(item.label || item.name) + (previewOnly?' — Click or drag to the main image':' — Click to select; drag to the main image to view');
      const visual=document.createElement(item.image?'img':'span');
      if(item.image) {visual.src=item.image;visual.alt=item.name;visual.draggable=false}
      else {visual.className='error';visual.textContent='Preview unavailable: '+item.error}
      const label=document.createElement('span');label.className='name';label.textContent=item.label || item.name;
      const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-hidden','true');
      tile.append(visual,label);if(!previewOnly) tile.append(mark);
      tile.addEventListener('keydown',e=>{if(e.target===tile && (e.key==='Enter'||e.key===' ')){e.preventDefault();tile.click()}});
      grid.append(tile);
    }
    tiles=[...grid.querySelectorAll('.tile')];update();initialized=true;
  }
  if(inline && !drag) {selected=new Set(args.selected);update()}
  send('streamlit:setFrameHeight',{height:previewOnly?grid.scrollHeight+8:inline?370:550});
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
